services:
  - type: web
    name: atlas-territorial-sul
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: ATLAS_PUBLIC_READ_ONLY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.10"
